[project]
name = "research-vault-backend"
version = "0.1.0"
description = "Research Vault backend - paper ingestion, pattern extraction, and query synthesis"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.16.0",
    "anthropic>=0.42.0",
    "fastapi>=0.128.0",
    "langgraph>=0.2.0",
    "openai>=1.58.0",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.16.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI uses function calls in defaults for dependency injection
"app/routers/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
